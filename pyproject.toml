[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillforge"
version = "0.1.0"
description = "Autonomous skill synthesis, evolutionary optimization and stress-testing engine"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]
dev = ["pytest>=8", "hypothesis>=6.100", "httpx2"]

[project.scripts]
skillforge = "skillforge.cli:main"

[tool.setuptools.packages.find]
include = ["skillforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
